name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Testcontainers starts a real MySQL in Docker, which ubuntu-latest runners provide
      - name: Run tests
        run: ./mvnw -B test
